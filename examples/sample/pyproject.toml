[project]
name = "example-sample"
description = "Sample Project"
license = { text = "GPLv3" }

authors = [{ name = "Synodic Software", email = "contact@synodic.software" }]

readme = 'README.md'

dynamic = ["version"]

dependencies = []
requires-python = ">=3.14"

[dependency-groups]
lint = ["ruff>=0.14.7", "pyrefly>=0.43.1", "isort>=7.0.0"]
test = ["pytest-cov>=7.0.0", "pytest-mock>=3.15.1"]

[tool.pytest.ini_options]
log_cli = true
testpaths = ["tests"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
ignore = ["D206", "D300", "D415", "E111", "E114", "E117"]
select = [
	"D",   # pydocstyle
	"F",   # Pyflakes
	"I",   # isort
	"PL",  # pylint
	"UP",  # pyupgrade
	"E",   # pycodestyle
	"B",   # flake8-bugbear
	"SIM", # flake8-simplify
	"PT",  # flake8-pytest-style
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "single"

[tool.coverage.report]
skip_empty = true

[build-system]
build-backend = "pdm.backend"
requires = ["pdm.backend"]
